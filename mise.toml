# menard — mise tasks. The install tasks wire menard into a harness with no host repo required:
# clone menard, `mise run install:pi` (or `install:claude`), and the guard, the MCP server, the
# formatter and the skill are all in place. menard is standalone.

[tasks."install:path"]
description = "Put `menard` on PATH (~/.local/bin); inside a menard checkout or worktree it runs that one"
run = "scripts/install-path.sh"

[tasks."install:pi"]
description = "Wire menard into pi: the guard extension, the MCP server, and the skill"
depends = ["install:path"]
run = "scripts/install-pi.sh"

[tasks."install:claude"]
description = "Wire menard into Claude Code: the plugin (MCP, hooks, skill) via the marketplace"
depends = ["install:path"]
run = "scripts/install-claude.sh"

[tasks.test]
description = "menard's pi adapter unit suite (bun test)"
dir = "pi"
run = "bun test"

[tasks."test:elixir"]
description = "menard's own gate — format + warnings-as-errors + tests"
run = "mix format --check-formatted && mix compile --warnings-as-errors && mix test"

[tasks.check]
description = "menard's gate, as a server's `mise run check` expects it: test:elixir and the pi bun suite"
depends = ["test:elixir", "test"]

[tasks."bench:identity"]
description = "The identity corpus over pinned hex packages: every edit that writes back what is there must leave the file as it was"
run = "mix test --only corpus test/menard/hex_corpus_test.exs"

[tasks.eval]
description = "menard vs. no menard: run eval cases headless (eval/run.py ROUND --cases … --arms A,B,C --models … --runs N)"
run = "python3 eval/run.py"

[tasks."eval:report"]
description = "Aggregate eval rounds into eval/REPORT.md (eval/report.py ROUND…)"
run = "python3 eval/report.py"
