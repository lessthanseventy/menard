name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v5

      # the tools of every language menard checks, and mise, which runs a host on its own toolchain
      - uses: cachix/install-nix-action@v31
      - run: |
          nix profile install nixpkgs#{nixfmt,statix,nil,lua,stylua,zig,biome,shfmt,shellcheck,mise}
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ hashFiles('.tool-versions') }}-erlang-27.3.4.2-elixir-1.19.4-otp-27

      # menard's toolchain, and the older one the host-toolchain tests pin
      - run: |
          mise install
          mise install erlang@27.3.4.2 elixir@1.19.4-otp-27
          mise exec -- mix local.hex --force
          mise exec -- mix local.rebar --force

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ hashFiles('.tool-versions', 'mix.lock') }}

      - run: mise exec -- mix deps.get
      - run: mise exec -- mix precommit
